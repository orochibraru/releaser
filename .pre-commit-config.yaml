# Run with prek: `prek install` once, then hooks run on every commit (`prek run --all-files` to run manually).
repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.8
    hooks:
      - id: prettier
        name: Format Markdown (prettier)
        types: [markdown]
        exclude: ^CHANGELOG\.md$

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
        name: Lint Markdown (markdownlint)

  - repo: local
    hooks:
      - id: pinact
        name: Pin actions (pinact)
        entry: pinact run
        language: golang
        additional_dependencies: [github.com/suzuki-shunsuke/pinact/v5/cmd/pinact@v5.0.0]
        files: ^\.github/workflows/.*\.ya?ml$
      - id: gofmt
        name: gofmt
        entry: gofmt -l -w
        language: system
        types: [go]
      - id: go-mod-tidy
        name: go mod tidy
        entry: go mod tidy -diff
        language: system
        files: ^go\.(mod|sum)$|\.go$
        pass_filenames: false
      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        types: [go]
        pass_filenames: false
      - id: go-test
        name: go test
        entry: go test -short ./... # full suite (Docker example) runs in CI
        language: system
        types: [go]
        pass_filenames: false
