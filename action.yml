name: Releaser
description: semantic-release without the plugins. Version, CHANGELOG, tag, GitHub release, artifacts and Docker image.
author: orochibraru
branding:
  icon: tag
  color: purple

inputs:
  branch:
    description: Branch to release from.
    default: main
  rules:
    description: "Bump overrides, e.g. breaking=patch,feat=patch. Defaults: breaking=major, feat=minor, fix/perf/revert=patch."
    default: ""
  prepare:
    description: Shell command run before the release commit. ${version} is replaced with the new version.
    default: ""
  commit:
    description: Extra files for the release commit (comma separated). CHANGELOG.md and package.json are always included.
    default: ""
  artifacts:
    description: "Artifact mode: files to attach to the GitHub release, one per line or comma separated, as path[=name]. Globs and ${version} work."
    default: ""
  docker:
    description: "Docker mode: build ./Dockerfile and push <image>:<version> and <image>:latest (<image>:<prerelease id> for prereleases)."
    default: "false"
  docker-image:
    description: Image name. Defaults to ghcr.io/<owner>/<repo>.
    default: ""
  docker-platforms:
    description: Build platforms, e.g. linux/amd64,linux/arm64 (needs docker/setup-qemu-action and docker/setup-buildx-action).
    default: ""
  draft:
    description: Create the GitHub release as a draft, to publish it yourself once assets are attached.
    default: "false"
  prerelease:
    description: "Ship every push as a prerelease X.Y.Z-<id>.N (e.g. canary): tag and GitHub prerelease, no release commit."
    default: ""
  release-pr:
    description: Open or update a release PR instead of committing. Merging it tags the release. Check out with a deploy key (ssh-key) so the PR's checks run; see docs/trunk.md.
    default: "false"
  dry-run:
    description: Only print the next release. Still sets the version and tag outputs.
    default: "false"
  token:
    description: Token for the GitHub release, asset uploads, release PR and ghcr.io login.
    default: ${{ github.token }}

outputs:
  released:
    description: '"true" if a release was made.'
    value: ${{ steps.release.outputs.released }}
  version:
    description: The released version, e.g. 1.2.3. On a dry run, the version that would be released. Empty if nothing to release.
    value: ${{ steps.release.outputs.version }}
  tag:
    description: The released tag, e.g. v1.2.3. On a dry run, the tag that would be released. Empty if nothing to release.
    value: ${{ steps.release.outputs.tag }}
  prerelease:
    description: '"true" if the version is a prerelease (X.Y.Z-<id>.N). Empty if nothing to release.'
    value: ${{ steps.release.outputs.prerelease }}

runs:
  using: composite
  steps:
    - id: release
      shell: bash
      env:
        # Bumped by this repo's own release (see .github/workflows/ci.yml), with the SHA-256 of each binary.
        RELEASER_VERSION: "1.7.0"
        RELEASER_SHA256_LINUX_AMD64: "3a1046534a6911e6542d1e12fef69cbecf2cbdc9f8b94e091271bf9b86c391e5"
        RELEASER_SHA256_LINUX_ARM64: "54ac06b0525dfcb814bf89fbf7c0eae35c606f7c262d7f01124dabae42d74c20"
        RELEASER_SHA256_DARWIN_AMD64: "4c0dd975f4fbbb002e622f3373a8f8aa94048aae4c2d54d12db4dce3ce725172"
        RELEASER_SHA256_DARWIN_ARM64: "b9dff58aa3945aa7a2427901a5cf556d880ca8f1525393da08d02c5523ae78a2"
        GITHUB_TOKEN: ${{ inputs.token }}
        IN_BRANCH: ${{ inputs.branch }}
        IN_RULES: ${{ inputs.rules }}
        IN_PREPARE: ${{ inputs.prepare }}
        IN_COMMIT: ${{ inputs.commit }}
        IN_ARTIFACTS: ${{ inputs.artifacts }}
        IN_DOCKER: ${{ inputs.docker }}
        IN_DOCKER_IMAGE: ${{ inputs.docker-image }}
        IN_DOCKER_PLATFORMS: ${{ inputs.docker-platforms }}
        IN_DRAFT: ${{ inputs.draft }}
        IN_PRERELEASE: ${{ inputs.prerelease }}
        IN_RELEASE_PR: ${{ inputs.release-pr }}
        IN_DRY_RUN: ${{ inputs.dry-run }}
      run: |
        set -euo pipefail
        os=$(tr '[:upper:]' '[:lower:]' <<< "$RUNNER_OS"); [ "$os" = macos ] && os=darwin
        arch=$(tr '[:upper:]' '[:lower:]' <<< "$RUNNER_ARCH"); [ "$arch" = x64 ] && arch=amd64
        bin="$RUNNER_TEMP/releaser"
        url="https://github.com/orochibraru/releaser/releases/download/v$RELEASER_VERSION/releaser-$os-$arch"
        sum="RELEASER_SHA256_$(tr a-z A-Z <<< "${os}_$arch")"
        # A release asset can be replaced; action.yml at the pinned ref can't. Anything unverified is rebuilt.
        if ! { curl -fsSL -o "$bin" "$url" && echo "${!sum:-}  $bin" | shasum -a 256 -c --status 2>/dev/null; }; then
          echo "::notice::no prebuilt releaser v$RELEASER_VERSION for $os/$arch matching its checksum, building from source"
          (cd "$GITHUB_ACTION_PATH" && go build -o "$bin" ./cmd/releaser)
        fi
        chmod +x "$bin"
        "$bin" -branch "$IN_BRANCH" -rules "$IN_RULES" -prepare "$IN_PREPARE" -commit "$IN_COMMIT" \
          -artifacts "$IN_ARTIFACTS" -docker="$IN_DOCKER" -docker-image "$IN_DOCKER_IMAGE" \
          -docker-platforms "$IN_DOCKER_PLATFORMS" -draft="$IN_DRAFT" -prerelease "$IN_PRERELEASE" \
          -release-pr="$IN_RELEASE_PR" -dry-run="$IN_DRY_RUN"
