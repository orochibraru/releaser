name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: j178/prek-action@v1

  # Dogfood: releaser releases itself with artifact mode.
  release:
    needs: prek
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - id: release
        run: go run ./cmd -commit action.yml -artifacts 'dist/*' -prepare "$PREPARE"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Pin action.yml to the new version and cross-compile the binaries it downloads.
          PREPARE: |
            set -e
            sed -i -E 's/(RELEASER_VERSION: ).*/\1"${version}"/' action.yml
            for p in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
              CGO_ENABLED=0 GOOS=${p%/*} GOARCH=${p#*/} go build -trimpath -ldflags="-s -w" -o "dist/releaser-${p%/*}-${p#*/}" ./cmd
            done
      # Marketplace users pin @v1: move the major tag to the new release.
      - if: steps.release.outputs.released == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git tag -f "${TAG%%.*}"
          git push -f origin "${TAG%%.*}"
